<!doctype html>
<html lang="ru" class="theme-orange">

<head>

  <title>Яндекс Смена — подработка сменами от 4 часов | Барори Парк</title>

  <!-- Страница только для рекламного трафика: в поиске не нужна, из sitemap исключена. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ff6b00" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />

  <link rel="dns-prefetch" href="https://smartcaptcha.yandexcloud.net">
  <link rel="preload" href="/fonts/oswald-700-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/open-sans-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Яндекс SmartCaptcha для формы заявки -->
  <script src="https://smartcaptcha.yandexcloud.net/captcha.js" defer></script>
</head>

<body>
  <div id="root"></div>
